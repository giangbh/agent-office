<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Văn phòng Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top">
  <h1 id="mainTitle">Văn phòng Agent<small id="sub">Đang kết nối…</small></h1>
  <div class="stats" id="stats"></div>
  <button class="sound" id="langBtn" title="Switch Language / Đổi ngôn ngữ">🌐 EN</button>
  <button class="sound" id="sound" aria-pressed="false">🔈 Bật âm thanh</button>
  <button class="sound" id="notify" aria-pressed="false">🔕 Bật thông báo</button>
  <button class="sound" id="replayBtn">⏪ Xem lại</button>
  <button class="sound" id="boardBtn">🏆 Xếp hạng</button>
  <button class="sound" id="termBtn">🖥️ Terminal</button>
  <button class="sound" id="hookBtn">⚡ Hooks</button>
</header>
<main class="floor" id="floor">
  <section class="room r-work" id="sec-work" aria-label="Khu làm việc">
    <header class="wall"><span class="plaque" id="plaque-work">🖥 Khu làm việc<b id="n-work">0</b></span><div class="deco"><div class="wboard"></div><div class="win"></div><div class="clock"></div></div></header>
    <div class="pods" id="room-work"></div>
    <div id="mascot" class="mascot" role="button" tabindex="0" title="Mascot">
      <span class="mascot-bubble" id="mascotBubble"></span>
      <img id="mascotImg" class="mascot-img" alt="Mascot" src="">
    </div>
    <div class="fdeco l"><img class="furn" data-furn="whiteboard" alt=""><img class="furn" data-furn="plant" alt=""></div>
    <div class="fdeco r"><img class="furn" data-furn="shelf" alt=""><img class="furn" data-furn="bin" alt=""></div>
  </section>
  <section class="room r-boss" id="sec-boss" aria-label="Phòng sếp: nhóm chờ bạn duyệt">
    <header class="wall"><span class="plaque" id="plaque-boss">📋 Phòng sếp<b id="n-boss">0</b></span><div class="deco"><div class="win"></div></div></header>
    <div class="bossdesk" id="bossdesk"></div>
    <div class="pods" id="room-boss"></div>
    <div class="fdeco r"><img class="furn" data-furn="shelf" alt=""><img class="furn" data-furn="plant" alt=""></div>
  </section>
  <section class="room r-rest" id="sec-rest" aria-label="Phòng chờ việc: nhóm rảnh">
    <header class="wall"><span class="plaque" id="plaque-rest">🛋 Phòng chờ việc<b id="n-rest">0</b></span><div class="deco"><img class="furn" data-furn="shelf" alt=""><div class="win"></div></div></header>
    <div class="pods" id="room-rest"></div>
    <div class="fdeco l"><img class="furn" data-furn="cooler" alt=""></div>
    <div class="fdeco r"><img class="furn" data-furn="sofa" alt=""><img class="furn" data-furn="plant" alt=""></div>
  </section>
  <section class="room r-nap" id="sec-nap" aria-label="Phòng ngủ gật: nhóm mất tín hiệu">
    <header class="wall"><span class="plaque" id="plaque-nap">💤 Phòng ngủ gật & Server<b id="n-nap">0</b></span><div class="deco"><div class="win"></div></div></header>
    <div class="pods" id="room-nap"></div>
    <span class="zzz" aria-hidden="true">z Z z</span>
    <div class="fdeco l"><img class="furn server-blink" data-furn="server" alt=""><img class="furn" data-furn="bin" alt=""></div>
    <div class="fdeco r"><img class="furn" data-furn="napsofa" alt=""></div>
  </section>
  <section class="room r-cafe" id="sec-cafe" aria-label="Pantry & Cà phê">
    <header class="wall"><span class="plaque" id="plaque-cafe">☕ Pantry & Cà phê<b id="n-cafe">0</b></span><div class="deco"><img class="furn" data-furn="coffee" alt=""><img class="furn" data-furn="cooler" alt=""></div></header>
    <div class="lounge"><p id="loungeDesc">Sub-agent làm xong ra đây ăn nhẹ & xả hơi</p><div id="lounge"></div></div>
    <div class="fdeco l"><img class="furn" data-furn="fridge" alt=""><img class="furn" data-furn="plant" alt=""></div>
    <div class="fdeco r"><img class="furn" data-furn="vending" alt=""></div>
  </section>
</main>
<aside class="drawer" id="board" aria-label="Bảng xếp hạng" style="--team:var(--lamp)" hidden></aside>
<aside class="drawer" id="drawer" hidden></aside>
<aside class="drawer term-drawer" id="termDrawer" aria-label="Retro Terminal Inspector" hidden></aside>
<aside class="drawer" id="hookDrawer" aria-label="Quản lý Hooks" style="--team:var(--mint)" hidden></aside>
<div class="replaybar" id="replaybar" hidden>
  <b id="replayTitle">⏪ Xem lại</b>
  <select id="replayMin" aria-label="Khoảng thời gian">
    <option value="15" id="opt-15">15 phút</option>
    <option value="60" id="opt-60" selected>1 giờ</option>
    <option value="240" id="opt-240">4 giờ</option>
    <option value="1440" id="opt-1440">24 giờ</option>
  </select>
  <button class="sound" id="replayPlay">▶ Phát</button>
  <input type="range" id="replaySlider" min="0" max="0" value="0" aria-label="Thời điểm">
  <span id="replayLabel"></span>
  <button class="sound" id="replayLive">Về trực tiếp</button>
</div>
<footer class="bar" id="bar"><span><span class="dot"></span><span id="conn">Đang kết nối</span></span><span>Agent Office · Claude Code · Gemini · Codex · Antigravity</span></footer>
<script type="module" src="/js/app.js"></script>
</body>
</html>
