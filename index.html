<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Văn phòng Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1C2438; --tile-a:#26314B; --tile-b:#2A3652; --wall:#151B2B;
  --desk:#A86A35; --desk-top:#C98B4F; --paper:#FFF4DE; --ink:#2B2233;
  --lamp:#FFC857; --mint:#7BD389; --coral:#FF7A6B; --muted:#9AA6C2;
  --display:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--paper);font-family:var(--body);font-size:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 32px;padding:20px 24px 16px;max-width:1280px;margin:auto}
h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;margin:0;letter-spacing:-.5px}
h1 small{display:block;font:400 13px/1.4 var(--body);color:var(--muted);margin-top:6px;letter-spacing:0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.stat{background:var(--night);border-radius:10px;padding:8px 14px;min-width:96px;border-bottom:3px solid var(--c)}
.stat b{display:block;font:800 24px/1 var(--display);color:var(--c)}
.stat span{font-size:12px;color:var(--muted)}
/* mặt bằng: mỗi trạng thái một phòng, nhóm "đi" giữa các phòng khi trạng thái đổi */
.floor{max-width:1280px;margin:0 auto 24px;display:grid;gap:6px;padding:6px;background:var(--night);border-radius:18px;min-height:520px;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) 300px;grid-template-areas:"work work boss" "rest nap cafe"}
.room{position:relative;display:flex;flex-direction:column;border-radius:12px;min-height:230px;background:var(--fl)}
.r-work{grid-area:work;min-height:340px;--fl:repeating-conic-gradient(var(--tile-a) 0 25%,var(--tile-b) 0 50%) 0 0/48px 48px}
.r-boss{grid-area:boss;--fl:radial-gradient(ellipse at 50% 35%,#6A3446,#3E2230 75%)}
.r-rest{grid-area:rest;--fl:repeating-linear-gradient(180deg,#4E3A2A 0 22px,#433122 22px 24px)}
.r-nap{grid-area:nap;--fl:radial-gradient(#ffffff1c 1px,transparent 1.6px) 0 0/22px 22px,#181E33}
.r-cafe{grid-area:cafe;--fl:repeating-linear-gradient(90deg,#2F4A3F 0 24px,#2B4439 0 48px)}
.wall{position:relative;flex:none;height:58px;display:flex;align-items:flex-end;gap:10px;padding:0 12px 6px;border-radius:12px 12px 0 0;
  background:linear-gradient(#3A4566,#2C3550);border-bottom:6px solid #1F2740}
.r-boss .wall{background:linear-gradient(#5A3A48,#46303A)}
.r-nap .wall{background:linear-gradient(#252C45,#1E2438)}
.r-cafe .wall{background:linear-gradient(#35574A,#2B463C)}
.plaque{align-self:center;font:800 14px/1 var(--display);background:var(--paper);color:var(--ink);padding:5px 10px 3px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
.plaque b{display:inline-block;min-width:20px;margin-left:6px;padding:2px 6px 0;border-radius:999px;background:var(--ink);color:var(--paper);font-size:12px;text-align:center}
.deco{margin-left:auto;display:flex;align-items:flex-end;gap:10px}
.furn{display:block;image-rendering:pixelated;pointer-events:none}
.win{position:relative;width:46px;height:34px;border:3px solid #C9D2E6;border-radius:2px;background:linear-gradient(#7EC8FF,#CDEBFF);overflow:hidden}
.win::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 45%,#C9D2E6 45% 55%,transparent 55%),linear-gradient(transparent 45%,#C9D2E6 45% 55%,transparent 55%)}
.win::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;left:7px;top:5px;background:#FFE066;box-shadow:0 0 8px #FFE066}
.night .win{background:linear-gradient(#0E1430,#25305A)}
.night .win::after{background:#E9EEF7;box-shadow:0 0 6px #E9EEF7}
.r-nap .win{background:linear-gradient(#0E1430,#25305A)}
.r-nap .win::after{background:#E9EEF7;box-shadow:0 0 6px #E9EEF7}
.wboard{width:58px;height:32px;background:#F4F6FB;border:3px solid #9AA6C2;border-radius:2px;
  background-image:linear-gradient(90deg,#FF7A6B 0 40%,transparent 0),linear-gradient(90deg,#5AB0FF 0 65%,transparent 0),linear-gradient(90deg,#7BD389 0 30%,transparent 0);
  background-size:100% 3px;background-repeat:no-repeat;background-position:6px 6px,6px 13px,6px 20px}
.clock{width:34px;height:34px;border-radius:50%;background:var(--paper);border:3px solid #6C7894;color:var(--ink);font:700 10px/28px var(--body);text-align:center}
.fdeco{position:absolute;bottom:8px;display:flex;align-items:flex-end;gap:8px;pointer-events:none;z-index:0}
.fdeco.l{left:10px}.fdeco.r{right:10px}
.pods{position:relative;flex:1;padding:16px 16px 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:20px;align-content:start}
.r-boss .pods,.r-rest .pods,.r-nap .pods{grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
.r-boss .pods{padding-bottom:16px}
.vacant{grid-column:1/-1;color:var(--muted);font-size:12px;text-align:center;padding:24px 8px;opacity:.8}
.bossdesk{display:flex;align-items:flex-end;gap:10px;padding:14px 16px 0}
.bossdesk .table{width:96px;margin-top:0}
.bossdesk .who{font-size:12px;color:var(--paper)}
.bossdesk .who span{display:block;color:var(--muted);font-size:11px}
.queue{padding:8px 16px 0;font-size:11px;color:#E8B6C4}
.zzz{position:absolute;right:18px;top:70px;font:800 16px var(--display);color:#AFC0EE;opacity:.7;animation:zzz 3s ease-in-out infinite;pointer-events:none}
@keyframes zzz{50%{transform:translate(4px,-8px);opacity:.3}}
.pod.walk .lead .person .f1{animation:f1 .25s steps(1) infinite}
.pod.walk .lead .person .f2{animation:f2 .25s steps(1) infinite}
.pod{cursor:pointer;border:2px dashed color-mix(in srgb,var(--team) 55%,transparent);border-radius:16px;padding:14px 14px 18px;position:relative;z-index:1;background:color-mix(in srgb,var(--team) 6%,transparent)}
.pod.walk{z-index:5}
.pod:hover,.pod:focus-visible{border-style:solid;outline:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--night);border-left:4px solid var(--team);padding:18px 18px 70px;overflow:auto;z-index:10;box-shadow:-8px 0 24px rgba(0,0,0,.4)}
.drawer[hidden],.replaybar[hidden]{display:none}
.drawer h2{font:800 20px/1.2 var(--display);margin:0 0 4px;color:var(--team)}
.drawer h3{font:800 13px var(--display);margin:18px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.drawer .x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}
.drawer .prompt{white-space:pre-wrap;word-break:break-word;background:var(--wall);border-radius:8px;padding:10px;font-size:12px;line-height:1.5;max-height:200px;overflow:auto}
.drawer ul{list-style:none;margin:0;padding:0;font-size:12px}
.drawer li{padding:5px 0;border-bottom:1px solid #2E3955;word-break:break-word}
.drawer li small{color:var(--muted);margin-right:6px}
.drawer li.bad{color:var(--coral)}
.drawer .st{font-size:11px;color:var(--muted)}
.gantt{position:relative;font-size:11px}
.gantt .row{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:center;margin:3px 0}
.gantt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--paper)}
.gantt .lane{position:relative;height:12px;background:var(--wall);border-radius:3px}
.gantt .span{position:absolute;top:0;bottom:0;min-width:3px;border-radius:3px;background:var(--team);opacity:.55}
.gantt .span.on{opacity:1;background:repeating-linear-gradient(45deg,var(--team) 0 6px,var(--lamp) 0 12px)}
.gantt .axis{display:flex;justify-content:space-between;margin-left:96px;color:var(--muted);font-size:10px}
.replaybar{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--night);border-top:3px solid var(--lamp);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.replaybar input[type=range]{flex:1;min-width:160px}
.replaybar select{background:var(--wall);color:var(--paper);border:1px solid #3A4766;border-radius:6px;padding:6px}
.flag{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-width:0}
.engine{display:inline-flex;align-items:center;gap:5px;font:700 11px/1 var(--body);padding:3px 8px 3px 6px;border-radius:999px;background:color-mix(in srgb,var(--pc) 22%,transparent);color:var(--pc);white-space:nowrap;border:1px solid color-mix(in srgb,var(--pc) 50%,transparent)}
.pixel-logo{display:inline-block;width:14px;height:14px;image-rendering:pixelated;flex:none}
.usage{font-size:11px;color:var(--muted);white-space:nowrap}
.flag-task{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead{display:flex;align-items:center;gap:10px;min-height:76px}
.desks{display:flex;flex-wrap:wrap;gap:14px 10px;margin-top:12px}
.desk{width:88px;display:flex;flex-direction:column;align-items:center;text-align:center}
.table{width:76px;height:12px;background:var(--desk-top);border-bottom:6px solid var(--desk);position:relative;margin-top:-6px;
  box-shadow:4px 0 0 var(--desk),-4px 0 0 var(--desk),0 10px 0 -2px rgba(0,0,0,.25)}
.laptop{position:absolute;left:50%;top:-12px;width:24px;height:12px;background:#D7DEEA;transform:translateX(-50%);
  box-shadow:inset 0 0 0 3px #6C7894,0 2px 0 #6C7894}
.desk.working .laptop{background:var(--lamp);animation:screen 1.2s steps(1) infinite}
@keyframes screen{50%{background:#FFE29A}}
.tag{font-size:11px;line-height:1.3;color:var(--paper);margin-top:5px;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.act{font-size:10px;line-height:1.25;color:var(--ink);background:var(--paper);border-radius:8px 8px 8px 2px;padding:2px 6px;margin-bottom:4px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.timer{font-size:10px;color:var(--muted)}
/* nhân vật */
.person{position:relative;width:36px;height:45px;flex:none}
.person img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.person .f2{visibility:hidden}
.person.working .f1{animation:f1 .5s steps(1) infinite}
.person.working .f2{animation:f2 .5s steps(1) infinite}
.person.waiting .f1{animation:f1 1s steps(1) infinite}
.person.waiting .f2{animation:f2 1s steps(1) infinite}
@keyframes f1{0%{visibility:visible}50%{visibility:hidden}}
@keyframes f2{0%{visibility:hidden}50%{visibility:visible}}
.lead .person{width:48px;height:60px}
/* hiệu ứng theo loại sub-agent: scout, reviewer, sonic, builder, debugger, writer, security */
.person .acc{position:absolute;font-size:14px;line-height:1;pointer-events:none}
.k-scout .acc{right:-12px;top:14px}
.k-reviewer .acc{right:-11px;top:18px;filter:hue-rotate(-20deg) saturate(1.6)}
.k-sonic .acc{left:-16px;top:20px;font-size:12px}
.k-builder .acc{right:-14px;top:10px}
.k-debugger .acc{right:-13px;top:16px}
.k-writer .acc{left:-14px;top:16px}
.k-security .acc{left:-14px;top:14px}
.person.working.k-scout .acc{animation:scan 1.6s ease-in-out infinite}
.person.working.k-reviewer .acc{animation:scribble .35s steps(2) infinite}
.person.working.k-sonic .acc{animation:dash .3s steps(2) infinite}
.person.working.k-sonic .f1{animation-duration:.18s}
.person.working.k-sonic .f2{animation-duration:.18s}
.person.working.k-builder .acc{animation:hammer .4s ease-in-out infinite}
.person.working.k-debugger .acc{animation:spray .6s ease-in-out infinite}
.person.working.k-writer .acc{animation:scroll .8s ease-in-out infinite}
.person.working.k-security .acc{animation:guard 1.4s ease-in-out infinite}
@keyframes scan{50%{transform:translate(-8px,-4px) rotate(-18deg)}}
@keyframes scribble{50%{transform:translate(2px,2px) rotate(12deg)}}
@keyframes dash{50%{transform:translateX(-4px);opacity:.4}}
@keyframes hammer{0%,100%{transform:rotate(0)}50%{transform:rotate(-35deg) translate(-2px,-3px)}}
@keyframes spray{0%,100%{transform:scale(1)}50%{transform:scale(1.25) rotate(10deg)}}
@keyframes scroll{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes guard{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.server-blink{animation:server-led 1.2s steps(2) infinite}
@keyframes server-led{50%{filter:brightness(1.35) drop-shadow(0 0 4px #22C55E)}}
.sound{font:600 13px var(--body);background:var(--night);color:var(--paper);border:2px solid #3A4766;border-radius:8px;padding:8px 12px;cursor:pointer}
.sound[aria-pressed="true"]{border-color:var(--mint);color:var(--mint)}
.sound:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.bubble{background:var(--paper);color:var(--ink);font-size:12px;padding:6px 10px;border-radius:12px 12px 12px 3px;max-width:210px;line-height:1.35;word-break:break-word}
.waiting .bubble{background:var(--lamp)}
.idle .bubble{background:transparent;color:var(--muted);padding:0}
.pod.stale{opacity:.6;border-style:dotted}
.pod.stale .bubble{background:transparent;color:var(--muted);padding:0}
.pod.stale .person .f1,.pod.stale .person .f2,.pod.stale .person .acc,.pod.stale .desk.working .laptop{animation:none!important}
.pod.stale .lead .person::before{content:'💤';position:absolute;right:-14px;top:-8px;font-size:14px}
.pod.conflict{border-color:var(--coral);border-style:solid}
.conflict{margin-top:8px;font-size:11px;line-height:1.4;color:var(--ink);background:var(--coral);border-radius:6px;padding:4px 8px}
.conflict b{font-weight:700}
.btn-remove{margin-top:22px;width:100%;background:transparent;color:var(--coral);border:1px dashed var(--coral);border-radius:8px;padding:8px;font:600 12px var(--body);cursor:pointer}
.bubble.err{background:var(--coral);color:var(--ink)}
.person.err::after{content:'💦';position:absolute;right:-10px;top:-6px;font-size:14px}
.timer.stuck{color:var(--coral);font-weight:600}
.role{font:600 11px var(--body);color:var(--team)}
/* góc cà phê */
.lounge{position:relative;z-index:1;padding:14px 16px 70px}
.lounge p{margin:0 0 14px;color:#B6CFC2;font-size:12px}
.done{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.done .tag{margin:0;font-size:12px}
.done .check{color:var(--mint);font-size:11px}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:80px 20px;font-size:15px;line-height:1.6}
.empty code{background:var(--night);padding:2px 6px;border-radius:4px;color:var(--paper)}
.bar{max-width:1280px;margin:0 auto 24px;padding:0 24px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);margin-right:6px}
.off .dot{background:var(--coral)}
@media (max-width:900px){.floor{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"work work" "boss rest" "nap cafe"}}
@media (max-width:760px){.floor{grid-template-columns:1fr;grid-template-areas:"work" "boss" "rest" "nap" "cafe"}.pods{padding:12px 12px 70px}.stats{margin-left:0}}
@media (prefers-reduced-motion:reduce){.person .f1,.person .f2,.person .acc,.desk.working .laptop,.zzz{animation:none!important}}
#board{z-index:12}
.board-day{background:var(--wall);color:var(--paper);border:1px solid #3A4766;border-radius:6px;padding:4px 6px;font:12px var(--body)}
.rank li{display:flex;align-items:center;gap:8px}
.rank .no{font:800 14px var(--display);width:22px;text-align:center;color:var(--muted)}
.rank li:nth-child(1) .no{color:var(--lamp)}
.rank .who{flex:1;min-width:0}
.rank .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .val{font-weight:700;color:var(--mint);white-space:nowrap}
.rank .person{margin-left:12px}

/* Cảnh báo vòng lặp vô tận (Runaway loop alarm) */
.pod.runaway{border:3px solid #FF3B30!important;background:color-mix(in srgb,#FF3B30 14%,transparent)!important;animation:runaway-glow .8s ease-in-out infinite alternate}
@keyframes runaway-glow{0%{box-shadow:0 0 8px rgba(255,59,48,.35)}100%{box-shadow:0 0 24px rgba(255,59,48,.85)}}
.runaway-badge{display:inline-flex;align-items:center;gap:4px;background:#FF3B30;color:#FFF;font:800 11px/1 var(--display);padding:3px 8px;border-radius:999px;animation:alarm-flash .5s steps(2) infinite}
@keyframes alarm-flash{50%{background:#B91C1C}}
.runaway-box{margin:12px 0;padding:12px 14px;background:rgba(255,59,48,.16);border:2px solid #FF3B30;border-radius:8px;color:#FF7A6B}
.runaway-box b{color:#FFF;display:flex;align-items:center;gap:6px;font:800 13px var(--display)}
.runaway-box p{margin:6px 0 4px;font-size:12px;color:#FFE4E6}
.runaway-box small{color:#FDA4AF;font-size:11px}
.person.runaway::after{content:'🚨';position:absolute;right:-14px;top:-12px;font-size:16px;animation:alarm-spin .8s ease-in-out infinite}
@keyframes alarm-spin{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}

/* Retro Terminal Inspector Drawer */
.term-drawer{width:min(680px,100vw);background:#0B0E14;border-left:4px solid var(--lamp);box-shadow:-12px 0 32px rgba(0,0,0,.7);display:flex;flex-direction:column;padding:0!important;overflow:hidden;z-index:20}
.term-drawer[hidden]{display:none}
.term-bezel{display:flex;flex-direction:column;height:100%;background:#111622;border:8px solid #1E2638;border-radius:12px;box-shadow:inset 0 0 16px rgba(0,0,0,.8);position:relative;overflow:hidden}
.term-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#1A233A;border-bottom:2px solid #2B3858;color:#9AA6C2;font:700 12px var(--display);flex-wrap:wrap;gap:8px}
.term-lights{display:flex;gap:6px;align-items:center}
.term-lights .light{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 4px currentColor}
.term-lights .red{background:#FF4949;color:#FF4949}
.term-lights .green{background:#22C55E;color:#22C55E}
.term-lights .yellow{background:#EAB308;color:#EAB308}
.term-title{font:800 12px/1 var(--display);letter-spacing:1px;color:var(--paper)}
.term-actions{display:flex;gap:6px;align-items:center}
.term-btn{background:#0F172A;color:#E2E8F0;border:1px solid #334155;border-radius:4px;padding:4px 8px;font:600 11px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.term-btn:hover{background:#1E293B;border-color:#64748B}
.term-close{font-size:18px;line-height:1;padding:2px 8px;background:none;border:0;color:var(--muted);cursor:pointer}
.term-close:hover{color:#FFF}
.term-screen{flex:1;overflow-y:auto;padding:14px;background:#05080F;color:#22C55E;font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,monospace;font-size:12px;line-height:1.55;position:relative;text-shadow:0 0 5px rgba(34,197,94,.4)}
.term-bezel::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 2px,transparent 2px 4px);pointer-events:none;z-index:3}
/* CRT Phosphor Amber theme */
.term-screen.amber{color:#FFB000;text-shadow:0 0 5px rgba(255,176,0,.4)}
.term-screen.amber .cmd-prompt{color:#FFC857}
.term-screen.amber .cmd-status.ok{color:#FFB000}
.term-screen.amber .cmd-body{border-left-color:#FFB000}
.term-screen.amber .cmd-output{color:#FDE68A}
/* Terminal line elements */
.cmd-block{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed rgba(255,255,255,.14)}
.cmd-block.target{background:rgba(255,200,87,.12);border-radius:4px;padding:6px 8px}
.cmd-prompt{color:#5AB0FF;font-weight:700}
.cmd-time{color:#64748B;font-size:11px;margin-right:6px}
.cmd-meta{display:flex;justify-content:space-between;align-items:center;margin-top:2px;font-size:11px}
.cmd-body{white-space:pre-wrap;word-break:break-word;margin:6px 0 0 10px;padding:6px 10px;background:rgba(0,0,0,.45);border-radius:4px;border-left:3px solid currentColor}
.cmd-output{margin-top:6px;padding:6px 10px;background:rgba(0,0,0,.6);border-radius:4px;font-size:11px;color:#A7F3D0;white-space:pre-wrap;word-break:break-word}
.cmd-status{font-weight:700;font-size:11px}
.cmd-status.ok{color:#22C55E}
.cmd-status.err{color:#FF4949;text-shadow:0 0 6px rgba(255,73,73,.6)}
.term-banner{margin-bottom:14px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid currentColor;border-radius:4px;font-size:11px;line-height:1.45;white-space:pre;overflow-x:auto}
.term-alert{background:rgba(239,68,68,.2);border:1px solid #EF4444;color:#FF7A6B;padding:8px 12px;border-radius:6px;margin-bottom:14px;font-weight:700;animation:term-siren 1s steps(2) infinite}
@keyframes term-siren{50%{background:rgba(239,68,68,.4);color:#FFFFFF}}
/* Tool items in drawer */
.tool-item{cursor:pointer;padding:6px 8px!important;border-radius:6px;transition:background .15s}
.tool-item:hover{background:rgba(255,255,255,.08)}
.tool-item .inspect-tag{opacity:.6;float:right;font-size:10px;padding:2px 5px;background:#0F172A;border:1px solid #334155;border-radius:4px;font-family:ui-monospace,monospace}

/* Hook Manager Drawer */
#hookDrawer{z-index:15}
.hook-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--wall);border:1px solid #2B3858;border-radius:8px;margin-bottom:8px}
.hook-item .info b{display:block;font-size:13px;color:var(--paper)}
.hook-item .info small{color:var(--muted);font-size:11px;display:block;margin-top:2px;word-break:break-all}
.hook-badge{padding:3px 8px;border-radius:999px;font:700 11px/1 var(--display)}
.hook-badge.on{background:rgba(34,197,94,.2);color:#22C55E;border:1px solid #22C55E}
.hook-badge.off{background:rgba(239,68,68,.2);color:#FF7A6B;border:1px solid #EF4444}
.hook-btn-row{display:flex;gap:10px;margin:16px 0}
.hook-btn-row button{flex:1;padding:8px 12px;font:700 12px var(--body);border-radius:6px;cursor:pointer}
.btn-install{background:var(--mint);color:var(--ink);border:none}
.btn-install:hover{filter:brightness(1.1)}
.btn-uninstall{background:rgba(239,68,68,.15);color:#FF7A6B;border:1px solid #EF4444}
.btn-uninstall:hover{background:rgba(239,68,68,.3)}

/* Mascot Mèo Quản Gia */
.mascot{position:absolute;bottom:14px;left:25%;z-index:4;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:left .75s cubic-bezier(.25,.8,.25,1);user-select:none}
.mascot:hover{filter:drop-shadow(0 0 6px rgba(255,200,87,.9))}
.mascot:active{transform:scale(1.2) translateY(-4px)!important}
.mascot-img{display:block;image-rendering:pixelated;transition:transform .2s ease}
.mascot-bubble{font-size:11px;line-height:1.2;background:rgba(255,255,255,.94);color:var(--ink);padding:4px 8px;border-radius:10px 10px 10px 2px;box-shadow:0 3px 10px rgba(0,0,0,.3);white-space:nowrap;margin-bottom:6px;pointer-events:none;opacity:0;transform:translateY(4px);transition:all .25s ease;font-weight:700}
.mascot-bubble.show{opacity:1;transform:none}
.mascot.sleeping .mascot-img{opacity:.85}
.mascot.sleeping .mascot-bubble{font-style:italic;color:#64748B;font-weight:500}
</style>

<script>
function pix(rows,pal,scale=3){
  const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const g=c.getContext('2d');
  rows.forEach((r,y)=>[...r].forEach((p,x)=>{if(pal[p]){g.fillStyle=pal[p];g.fillRect(x,y,1,1)}}));
  return {src:c.toDataURL(),w:c.width*scale,h:c.height*scale};
}

// Logo Pixel Art của các hãng AI / công cụ
const LOGOS={
  claude: pix([
    "....CC....",
    "...CCCC...",
    "...CCCC...",
    "..CCCCCC..",
    "CCCCCCCCCC",
    "CCCCCCCCCC",
    "..CCCCCC..",
    "...CCCC...",
    "...CCCC...",
    "....CC...."
  ], {C:'#E8946A'}, 1.5),

  gemini: pix([
    "....BB....",
    "...bBBb...",
    "...bBBb...",
    "..bbBBbb..",
    "PPPBBPBPPP",
    "PPPBBPBPPP",
    "..bbBBbb..",
    "...bBBb...",
    "...bBBb...",
    "....BB...."
  ], {B:'#4285F4', b:'#7FA7FF', P:'#A855F7'}, 1.5),

  openai: pix([
    "...GGGG...",
    "..GG..GG..",
    ".GG.GG.GG.",
    "GG.GGGG.GG",
    "GG.GGGG.GG",
    ".GG.GG.GG.",
    "..GG..GG..",
    "...GGGG..."
  ], {G:'#10A37F'}, 1.5),

  antigravity: pix([
    "....AA....",
    "...AAAA...",
    "..AA..AA..",
    "..AAAAAA..",
    ".AAAAAAAA.",
    ".AA....AA.",
    "AA......AA"
  ], {A:'#8B5CF6'}, 1.5),

  codex: pix([
    "GGGGGGGGGG",
    "G........G",
    "G..GG....G",
    "G...GG...G",
    "G....GG..G",
    "G...GG...G",
    "G..GG....G",
    "G........G",
    "GGGGGGGGGG"
  ], {G:'#5FD3A8'}, 1.5),

  omp: pix([
    "PPPPPPPPPP",
    "..PP..PP..",
    "..PP..PP..",
    "..PP..PP..",
    "..PP..PP..",
    "..PP...PP."
  ], {P:'#F59E0B'}, 1.5),

  generic: pix([
    "..KKKKKK..",
    ".K.K..K.K.",
    ".KKKKKKKK.",
    ".KK.KK.KK.",
    ".KKKKKKKK.",
    "..KK..KK.."
  ], {K:'#94A3B8'}, 1.5),
};

const COLORS=['#FF7A6B','#5AB0FF','#B98CFF','#FFC857','#4FD1C5','#FF9ECF','#9AD45A'];
const color=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
// Nhận diện hãng và logo pixel art tương ứng
const provider=(m, source)=>{
  const text=(String(m||'')+' '+String(source||'')).toLowerCase();
  if(/antigravity/.test(text)) return ['Antigravity','#8B5CF6','antigravity'];
  if(/claude|anthropic|opus|sonnet|haiku/.test(text)) return ['Claude','#E8946A','claude'];
  if(/gemini|google/.test(text)) return ['Gemini','#7FA7FF','gemini'];
  if(/codex/.test(text)) return ['Codex','#5FD3A8','codex'];
  if(/gpt|openai|\bo[1-9]/.test(text)) return ['OpenAI','#5FD3A8','openai'];
  if(/omp/.test(text)) return ['omp','#F59E0B','omp'];
  return [m?m.split('/').pop():source||'Agent','#B6BCCB','generic'];
};
const fmtTok=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(Math.round(n));
const fmtCost=c=>'$'+(c<0.01?c.toFixed(4):c.toFixed(2));
const usageChip=s=>{const u=s.usage;if(!u)return'';
  const tip=`vào ${fmtTok(u.input||0)} · ra ${fmtTok(u.output||0)} · cache đọc ${fmtTok(u.cacheRead||0)} · cache ghi ${fmtTok(u.cacheWrite||0)}`+(u.cost!=null?` · ${fmtCost(u.cost)}`:'');
  return `<span class="usage" title="${tip}">${fmtTok((u.input||0)+(u.output||0))} tok${u.cost!=null?' · '+fmtCost(u.cost):''}</span>`};
const engineChip=s=>{
  const [name,c,key]=provider(s.model, s.source);
  const logo=LOGOS[key]||LOGOS.generic;
  const label=[s.source==='claude'?'Claude Code':s.source,s.model||name].filter(Boolean).join(' · ');
  return `<span class="engine" style="--pc:${c}" title="${esc(label)}"><img class="pixel-logo" src="${logo.src}" alt="${esc(name)}"><span>${esc(name)}</span></span>`;
};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---------- Pixel art: ghép nhân vật từ nhiều lớp ----------
// Mỗi ký tự là 1 pixel. "." = giữ nguyên lớp dưới.
// S da, E mắt, B áo (màu nhóm), b áo tối, L quần, D giày, H tóc, C/c mũ, G kính, K đen, T cà vạt, w chi tiết sáng
const BASE=[
"............",
"............",
"....SSSS....",
"...SSSSSS...",
"...SESSES...",
"...SSSSSS...",
"....SSSS....",
"..BBBBBBBB..",
".SBBBBBBBBS.",
".SBBBBBBBBS.",
"..BBBBBBBB..",
"..bbbbbbbb..",
"...LL..LL...",
"...LL..LL...",
"..DDD..DDD.."];
const ARMS_UP=[".SBBBBBBBBS.","..BBBBBBBB..","..BBBBBBBB.."]; // khung 2: tay đưa lên (hàng 7-9)
const L=(rows,start=0)=>({rows,start});
const HEADS={
  cap:     L(["....CCCC....","...CCCCCC...","..CCCCCCccc."]),
  beanie:  L([".....ww.....","...CCCCCC...","..CCCCCCCC..","..cccccccc.."]),
  short:   L(["............","...HHHHHH...","..HHHHHHHH..","..H......H.."]),
  spiky:   L(["..H.H..H.H..","..HHHHHHHH..","..HHHHHHHH..","..H......H.."]),
  long:    L(["............","...HHHHHH...","..HHHHHHHH..","..HHHHHHHH..","..H......H..","..H......H..","..HH....HH..","..HH....HH.."]),
  bun:     L([".....HH.....","....HHHH....","...HHHHHH...","..HH....HH.."]),
  side:    L(["............","...HHHHHHH..","..HHHHHHHHH.","..H.HHHH.H.."]),
  bald:    L(["............","............","....SSSS....","...SSSSSS..."]),
  headset: L(["............","...HHHHHH...","..KHHHHHHK..","..K......K..",".KK......KK.",".KK......KK."]),
  helmet:  L(["....yyyy....","...YYYYYY...","..YYYYYYYY..","..yy....yy.."]),
  wizard:  L([".....PP.....","....PPPP....","...PPPPPP...","..PPPPPPPP..","..pppppppp.."]),
  afro:    L(["...HHHHHH...","..HHHHHHHH..",".HHHHHHHHHH.",".HHHHHHHHHH.","..H......H.."]),
  retro:   L(["...HHHHHH...","..HH.HH.HH..","..HHHHHHHH..","..H......H..","..HH....HH.."]),
};
const FACES={
  none:L([]), glasses:L(["...GEGGEG..."],4), shades:L(["...KKKKKK..."],4),
  beard:L(["...HSSSSH...","....HHHH...."],5), stache:L(["....HHHH...."],5),
  vr:L(["...MMMMMM...","...mmmmmm..."],3), nerd:L(["..KEKK.KKEK."],4),
  mask:L(["....wwww....","....wwww...."],5), fullbeard:L(["...HSSSSH...","..HHSSSSH..","...HHHHHH..."],4),
};
const SHIRTS={
  plain:L([]), tie:L([".....TT.....","..BBBTTBBB..","..BBBTTBBB..","....TTTT...."],7),
  stripe:L(["..wwwwwwww.."],9), hoodie:L(["....w..w....","....w..w...."],7),
  collar:L(["....wwww...."],7), badge:L([".......ww..."],9),
  hawaii:L(["..B.w..w.B..",".SBwBwwBwBS.",".SBBwwBBwBS.","..B.w..w.B.."],7),
  suit:L(["..KK.ww.KK..",".SKK.ww.KKS.",".SKK.ww.KKS.","..KK....KK.."],7),
  sweater:L(["..wwwwwwww..","..w.ww.w.w..","..wwwwwwww.."],7),
};
const SKINS=['#F2C29B','#E0A878','#C68650','#8D5A3B','#FFD9B8','#6B4430'];
const HAIRS=['#2B1E16','#5A3825','#A0522D','#E8C07A','#C9C9D1','#D9534F','#3B5BA5','#111111'];
const PANTS=['#3A3F5C','#2D4C7A','#1F1F27','#7A6A4F','#4F5D45'];
const SHOES=['#1E2233','#5A3420','#EDEDED','#B33A3A'];
const shade=(hex,k)=>'#'+[1,3,5].map(i=>Math.min(255,Math.round(parseInt(hex.slice(i,i+2),16)*k)).toString(16).padStart(2,'0')).join('');
function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);
  return()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
const pickR=(r,arr)=>arr[Math.floor(r()*arr.length)];
// Đặc điểm cố định theo id: cùng agent luôn trông giống nhau
function traits(seed,leader){
  const r=rng(seed);
  return {head:pickR(r,Object.keys(HEADS)), face:r()<.55?'none':pickR(r,Object.keys(FACES)),
    shirt:leader?'tie':pickR(r,Object.keys(SHIRTS).filter(k=>k!=='tie')),
    skin:pickR(r,SKINS), hair:pickR(r,HAIRS), pants:pickR(r,PANTS), shoes:pickR(r,SHOES), capTone:r()};
}
const spriteCache={};
function sprite(team,seed,frame,leader){
  const key=team+seed+frame+leader; if(spriteCache[key]) return spriteCache[key];
  const t=traits(seed,leader);
  const cap=t.capTone<.5?team:shade(team,.7+t.capTone*.5);
  const pal={S:t.skin,E:'#2B2233',B:shade(team,.85),b:shade(team,.6),L:t.pants,D:t.shoes,H:t.hair,
    C:cap,c:shade(cap,.72),G:'#E9EEF7',K:'#1A1A22',T:leader?'#FFC857':'#C8423B',w:'#F4EEE2',
    Y:'#FFC857',y:'#CCA025',P:'#9333EA',p:'#6B21A8',M:'#38BDF8',m:'#0284C7',R:'#EF4444'};
  const grid=BASE.map(r=>[...r]);
  if(frame===1) ARMS_UP.forEach((r,i)=>grid[7+i]=[...r]);
  for(const layer of [HEADS[t.head],FACES[t.face],SHIRTS[t.shirt]])
    layer.rows.forEach((r,i)=>[...r].forEach((p,x)=>{if(p!=='.')grid[layer.start+i][x]=p}));
  const c=document.createElement('canvas');c.width=12;c.height=grid.length;const g=c.getContext('2d');
  grid.forEach((r,y)=>r.forEach((p,x)=>{if(pal[p]){g.fillStyle=pal[p];g.fillRect(x,y,1,1)}}));
  return spriteCache[key]=c.toDataURL();
}
// Phụ kiện theo loại sub-agent (tên agent của omp hoặc subagent_type của Claude Code)
const KINDS={
  scout:['🔍','Trinh sát'],
  reviewer:['🖍️','Soát lỗi'],
  sonic:['💨','Làm nhanh'],
  builder:['🔨','Thợ xây/Build'],
  debugger:['🪲','Diệt bọ/Fix'],
  writer:['📜','Tài liệu/Doc'],
  security:['🛡️','Bảo mật/Audit']
};
const kindOf=t=>{
  t=String(t||'').toLowerCase();
  if(/scout|explore|find|search/.test(t)) return 'scout';
  if(/review|check|audit|inspect/.test(t)) return /sec|vuln|auth/.test(t)?'security':'reviewer';
  if(/sonic|quick|fast/.test(t)) return 'sonic';
  if(/build|make|compile|deploy/.test(t)) return 'builder';
  if(/debug|fix|patch|bug/.test(t)) return 'debugger';
  if(/doc|write|read|readme/.test(t)) return 'writer';
  if(/sec|safety|guard/.test(t)) return 'security';
  return '';
};
const person=(col,state,seed='x',leader=false,type='')=>{const k=kindOf(type),acc=k&&KINDS[k];
  return `<div class="person ${state}${k?' k-'+k:''}"${acc?` title="${acc[1]}"`:''}><img class="f1" alt="" src="${sprite(col,seed,0,leader)}"><img class="f2" alt="" src="${sprite(col,seed,1,leader)}">${acc?`<span class="acc" aria-hidden="true">${acc[0]}</span>`:''}</div>`};
// ---------- Nội thất pixel art (cùng kiểu ghép ký tự như nhân vật) ----------
const SOFA=["..AAAAAAAAAAAA..",".AaaaaaaaaaaaaA.","AAaaaaaaaaaaaaAA","AAAAAAAAAAAAAAAA","AaaaaaaaaaaaaaaA","AAAAAAAAAAAAAAAA",".F............F."];
const FURN={
  plant:pix(["..g...g..",".gGg.gGg.","gGGgGgGGg",".gGGGGGg.","..ggGgg..","....G....","..PPPPP..","..ppppp..","...ppp..."],
    {g:'#5DBB63',G:'#2F7D3E',P:'#C46A3A',p:'#9A4E2A'},4),
  shelf:pix(["WWWWWWWWWW","WrbgyWrgbW","WrbgyWrgbW","WWWWWWWWWW","WgyrbWbyrW","WgyrbWbyrW","WWWWWWWWWW","WbrWWyggbW","WbrWWyggbW","WWWWWWWWWW"],
    {W:'#7A4E2D',r:'#FF7A6B',b:'#5AB0FF',g:'#7BD389',y:'#FFC857'},4),

let catState = {
  pct: 25,

  frame: 0,
  wait: 2,
  bubbleTimer: 0,
  text: "",
  sleeping: false
};

function initMascot() {
  const el = document.getElementById('mascot');
  if (!el) return;
  el.onclick = el.onkeydown = (e) => {
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    beep([[784, 0.06], [1046, 0.12], [1318, 0.18]]);
    catState.text = CAT_MEOWS_CLICK[Math.floor(Math.random() * CAT_MEOWS_CLICK.length)];
    catState.bubbleTimer = 5;
    catState.wait = Math.max(catState.wait, 3);
    updateMascotUI();
  };
  updateMascotUI();
}

function tickMascot(hasWorkingAgents) {
  const el = document.getElementById('mascot');
  if (!el) return;
  catState.sleeping = hasWorkingAgents;

  if (catState.sleeping) {
    catState.pct = 14;
    catState.dir = 1;
    catState.frame = 2;
    if (catState.bubbleTimer > 0) catState.bubbleTimer--;
    else if (Math.random() < 0.15) {
      catState.text = Math.random() < 0.5 ? "z Z z" : "Ngủ ngoan cho các bạn làm việc... 💤";
      catState.bubbleTimer = 4;
    }
  } else {
    if (catState.bubbleTimer > 0) {
      catState.bubbleTimer--;
    } else if (Math.random() < 0.22) {
      catState.text = CAT_MEOWS_PATROL[Math.floor(Math.random() * CAT_MEOWS_PATROL.length)];
      catState.bubbleTimer = 4;
    }

    if (catState.wait > 0) {
      catState.wait--;
      catState.frame = 0;
    } else {
      catState.pct += catState.dir * (4 + Math.random() * 3);
      catState.frame = catState.frame === 0 ? 1 : 0;

      if (catState.pct >= 80) {
        catState.dir = -1;
        catState.wait = Math.floor(2 + Math.random() * 3);
      } else if (catState.pct <= 14) {
        catState.dir = 1;
        catState.wait = Math.floor(2 + Math.random() * 3);
      } else if (Math.random() < 0.12) {
        catState.wait = Math.floor(2 + Math.random() * 3);
      }
    }
  }
  updateMascotUI();
}

function updateMascotUI() {
  const el = document.getElementById('mascot');
  const img = document.getElementById('mascotImg');
  const bbl = document.getElementById('mascotBubble');
  if (!el || !img || !bbl) return;

  const f = CAT_FRAMES[catState.frame] || CAT_FRAMES[0];
  img.src = f.src;
  img.width = f.w;
  img.height = f.h;

  el.style.left = catState.pct + '%';
  el.style.transform = `scaleX(${catState.dir})`;
  bbl.style.transform = `scaleX(${catState.dir})`;

  el.classList.toggle('sleeping', catState.sleeping);

  if (catState.bubbleTimer > 0 && catState.text) {
    bbl.textContent = catState.text;
    bbl.classList.add('show');
  } else {
    bbl.classList.remove('show');
  }
}

function capturePods(){const m=new Map();
  for(const el of document.querySelectorAll('#floor [data-sid]'))m.set(el.dataset.sid,{r:el.getBoundingClientRect(),room:el.parentElement.id});
  return m}
// Đang đi dở mà bị vẽ lại (mỗi giây) thì đi tiếp phần thời gian còn lại, không bắt đầu lại
const walkUntil=new Map();
function walkPods(old){
  if(reduceMotion.matches||document.hidden)return; // tab ẩn không vẽ khung hình: animation sẽ đứng ở điểm đầu
  const t=performance.now();
  for(const el of document.querySelectorAll('#floor [data-sid]')){
    const sid=el.dataset.sid, o=old.get(sid);
    if(!o){el.animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:350,easing:'ease-out'});continue}
    const r=el.getBoundingClientRect(),dx=o.r.left-r.left,dy=o.r.top-r.top;
    if(Math.abs(dx)+Math.abs(dy)<2)continue;
    if(o.room!==el.parentElement.id)walkUntil.set(sid,t+900);
    const left=(walkUntil.get(sid)||0)-t, walking=left>50;
    if(walking)el.classList.add('walk');else walkUntil.delete(sid);
    el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:walking?left:350,easing:'cubic-bezier(.3,.7,.4,1)'})
      .onfinish=()=>el.classList.remove('walk');
  }
}

function beep(notes){
  if(!soundOn) return;
  audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  let t=audio.currentTime;
  for(const [f,d] of notes){
    const o=audio.createOscillator(), g=audio.createGain();
    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t+d); t+=d*.85;
  }
}

let prev=null; // trạng thái lần trước để phát hiện thay đổi
function detectChanges(S){
  if(prev) S.forEach(s=>{if(s.status==='waiting'&&prev['s'+s.id]!=='waiting') notifyWaiting(s)});
  const cur={};
  let alarm=false;
  S.forEach(s=>{
    cur['s'+s.id]=s.status;
    cur['r'+s.id]=s.runaway?s.runaway.count:0;
    if(s.runaway && (!prev || !prev['r'+s.id])) alarm=true;
    // Trùng file mới (so theo danh sách file): kêu và báo hệ thống như vòng lặp
    const files=(s.conflicts||[]).map(c=>c.file).sort().join('|');
    cur['c'+s.id]=files;
    if(prev&&files&&(prev['c'+s.id]||'')!==files&&(s.conflicts||[]).some(c=>!(prev['c'+s.id]||'').split('|').includes(c.file))){alarm=true;notifyConflict(s)}
    s.agents.forEach(a=>cur['a'+a.id]=a.status);
  });
  if(prev){
    let done=false,waiting=false,hired=false;
    for(const k in cur){
      if(k[0]==='a'&&cur[k]==='done'&&prev[k]==='working') done=true;
      if(k[0]==='a'&&cur[k]==='working'&&!prev[k]) hired=true;
      if(k[0]==='s'&&cur[k]==='waiting'&&prev[k]!=='waiting') waiting=true;
    }
    if(alarm) beep(SOUND.alarm); else if(waiting) beep(SOUND.waiting); else if(done) beep(SOUND.done); else if(hired) beep(SOUND.hired);
  }
  prev=cur;
}

    ${(s.conflicts||[]).length?`<h3>⚠ Đang sửa trùng file</h3><ul>${s.conflicts.map(c=>`<li class="bad"><b>${esc(c.file)}</b><div class="st">Nhóm này (${esc(c.who)}, ${clock(c.at)})${c.others.map(o=>` · ${esc(o.project)} (${esc(o.who)}, ${clock(o.at)})`).join('')}</div></li>`).join('')}</ul>`:''}
    ${runawayBox}
    ${s.error?`<h3>Lỗi gần nhất</h3><ul><li class="bad"><small>${clock(s.error.at)}</small>${esc(s.error.text)}</li></ul>`:''}
    ${s.usage?`<h3>Token và chi phí</h3><ul><li>Vào: <b>${fmtTok(s.usage.input||0)}</b> · Ra: <b>${fmtTok(s.usage.output||0)}</b></li>
      <li>Cache đọc: ${fmtTok(s.usage.cacheRead||0)} · Cache ghi: ${fmtTok(s.usage.cacheWrite||0)}</li>
      <li>${s.usage.cost!=null?'Chi phí: <b>'+fmtCost(s.usage.cost)+'</b>':'<span class="st">Công cụ này không báo chi phí</span>'}</li></ul>`:''}
    <h3>Yêu cầu</h3><div class="prompt">${esc(s.prompt||s.task||'(chưa có)')}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px">
      <h3 style="margin:0">Tool gần đây (${tools.length})</h3>
      <button class="term-btn" id="openTermFromDrawer" title="Mở Retro Terminal Inspector">🖥️ Mở Terminal</button>
    </div>
    <ul>${tools.map(t=>`<li class="${t.error?'bad':''} tool-item" data-tool-id="${esc(t.id||'')}" title="Bấm để soi lệnh trong Terminal"><small>${clock(t.at)}</small>${t.error?'⚠ ':''}${esc(t.text)}<span class="inspect-tag">&gt;_ Soi</span></li>`).join('')||'<li>Chưa có</li>'}</ul>
    <h3>Sub-agent (${s.agents.length})</h3>
    ${gantt(s.agents,now)}
    <ul>${s.agents.map(a=>`<li><small>${a.status==='working'?'⏳':'✓'}</small><b>${esc(a.desc)}</b> <span class="st">${esc(a.type)} · ${ago((a.ended||now)-a.started)}${a.toolCount?' · '+a.toolCount+' tool':''}</span>${a.status==='working'&&a.activity?`<div class="st">▶ ${esc(a.activity)}</div>`:''}${a.prompt?`<div class="st">${esc(a.prompt)}</div>`:''}</li>`).join('')||'<li>Chưa có</li>'}</ul>
    ${replay?'':`<button class="btn-remove" id="removeGroup" title="Dùng khi phiên đã tắt nhưng nhóm vẫn còn. Nếu phiên còn chạy, nhóm sẽ quay lại ở sự kiện kế tiếp">🗑 Xoá nhóm khỏi văn phòng</button>`}`;
  const top=drawer.scrollTop;
  drawer.style.setProperty('--team',col); drawer.innerHTML=h; drawer.hidden=false; drawer.scrollTop=top;
  document.getElementById('drawerX').onclick=()=>{selected=null;render()};
  const otb=document.getElementById('openTermFromDrawer');
  if(otb) otb.onclick=()=>openTerminal(s.id);
  const rm=document.getElementById('removeGroup');
  if(rm) rm.onclick=async()=>{
    if(!confirm(`Xoá nhóm "${s.project}" khỏi văn phòng?`))return;
    let r;try{r=await fetch('/session-remove?id='+encodeURIComponent(s.id),{method:'POST'})}catch(e){alert('Không gọi được server');return}
    if(!r.ok){alert((await r.json().catch(()=>({}))).error||'Lỗi '+r.status);return}
    selected=null;render();
  };
  drawer.querySelectorAll('.tool-item').forEach(li=>{
    li.onclick=()=>openTerminal(s.id, li.dataset.toolId);
  });
}
// Dòng thời gian: mỗi sub-agent một thanh từ lúc bắt đầu đến lúc xong (đang chạy thì kéo tới hiện tại)
function gantt(agents,now){
  if(!agents.length) return '';
  const t0=Math.min(...agents.map(a=>a.started)), t1=Math.max(now,...agents.map(a=>a.ended||now)), span=Math.max(1,t1-t0);
  const pct=t=>((t-t0)/span*100).toFixed(2)+'%';
  return `<div class="gantt" aria-label="Dòng thời gian sub-agent">${agents.map(a=>{const end=a.ended||now;
    return `<div class="row"><span class="nm" title="${esc(a.desc)}">${esc(a.desc)}</span><span class="lane"><span class="span${a.status==='working'?' on':''}" style="left:${pct(a.started)};width:calc(${pct(end)} - ${pct(a.started)})" title="${clock(a.started)} → ${a.ended?clock(a.ended):'đang chạy'} (${ago(end-a.started)})"></span></span></div>`}).join('')}
    <div class="axis"><span>${clock(t0)}</span><span>${ago(span)}</span><span>${clock(t1)}</span></div></div>`;
}
const floorEl=document.getElementById('floor');
floorEl.onclick=e=>{const p=e.target.closest('[data-sid]');if(p){selected=p.dataset.sid;render()}};
floorEl.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const p=e.target.closest('[data-sid]');if(p){e.preventDefault();selected=p.dataset.sid;render()}}};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const td=document.getElementById('termDrawer');
    if(!hookDrawer.hidden){closeHooksUI()}else if(!td.hidden){closeTerminal()}else if(!board.hidden){closeBoard()}else if(selected){selected=null;render()}
  } else if((e.key==='t'||e.key==='T') && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
    const td=document.getElementById('termDrawer');
    if(td.hidden) openTerminal(); else closeTerminal();
  }
});

// ---------- Retro Terminal Inspector ----------
let termColor=localStorage.getItem('agentOfficeTermColor')||'green'; // 'green' hoặc 'amber'
let termTargetSid=null, termTargetToolId=null;

function renderTerminal(){
  const td=document.getElementById('termDrawer');
  if(td.hidden) return;
  const s=state.sessions.find(x=>x.id===(termTargetSid||selected))||state.sessions[0];
  if(!s){
    td.innerHTML=`<div class="term-bezel"><div class="term-header"><div class="term-title">AGENT_OS TERMINAL</div><button class="term-close" id="termX">×</button></div><div class="term-screen">&gt; Chưa có session nào hoạt động trong văn phòng.</div></div>`;
    document.getElementById('termX').onclick=closeTerminal;
    return;
  }
  termTargetSid=s.id;
  const tools=s.tools||[];
  const now=Date.now();
  let runawayAlert='';
  if(s.runaway){
    runawayAlert=`<div class="term-alert">
      [!] CẢNH BÁO VÒNG LẶP VÔ TẬN (RUNAWAY LOOP)
      &gt; ${esc(s.runaway.msg)}
      &gt; LOẠI: ${esc(s.runaway.type).toUpperCase()} | PHÁT HIỆN LÚC: ${clock(s.runaway.at||now)}
    </div>`;
  }
  const banner=`<div class="term-banner">╔══════════════════════════════════════════════════════════════════════════════╗
║ AGENT_OS v1.0.4 • RETRO CRT TERMINAL INSPECTOR                           ║
║ DỰ ÁN: ${esc(s.project).padEnd(20)} MODEL: ${(esc(s.model||s.source||'claude')).padEnd(14)} TRẠNG THÁI: ${(esc(s.status)).toUpperCase().padEnd(10)}║
║ CWD: ${(esc(s.cwd||'/workspace/'+s.project)).padEnd(68)}║
╚══════════════════════════════════════════════════════════════════════════════╝</div>`;

  const items=tools.map((t,idx)=>{
    const isTarget=termTargetToolId&&t.id===termTargetToolId;
    const statusText=t.error?'EXIT 1 (LỖI)':(t.output?'EXIT 0 (OK)':'RUNNING / ĐANG CHẠY');
    const statusClass=t.error?'err':(t.output?'ok':'');
    const promptLine=`agent@${esc(s.project)}:~$ ${esc(t.text)}`;
    const inputContent=t.input?`<div class="cmd-body"><span style="opacity:.7">&gt; INPUT:</span>\n${esc(t.input)}</div>`:'';
    const outputContent=t.output?`<div class="cmd-output"><span style="opacity:.7">&gt; OUTPUT:</span>\n${esc(t.output)}</div>`:'';
    return `<div class="cmd-block${isTarget?' target':''}" id="cmd-${idx}">
      <div><span class="cmd-time">[${clock(t.at)}]</span><span class="cmd-prompt">${promptLine}</span></div>
      <div class="cmd-meta"><span class="cmd-status ${statusClass}">${statusText}</span><button class="term-btn copy-cmd-btn" data-cmd="${esc(t.input||t.text)}" title="Chép lệnh">📋</button></div>
      ${inputContent}
      ${outputContent}
    </div>`;
  }).join('')||'<div style="opacity:.6;padding:20px 0">&gt; Chưa có lệnh nào được gọi trong phiên này.</div>';

  td.innerHTML=`
    <div class="term-bezel">
      <div class="term-header">
        <div class="term-lights">
          <span class="light red" title="Sẵn sàng"></span>
          <span class="light green" title="Bảo vệ vòng lặp: HOẠT ĐỘNG"></span>
          <span class="light yellow" title="Luồng sự kiện SSE: ĐÃ KẾT NỐI"></span>
        </div>
        <div class="term-title">AGENT_OS // CRT_CONSOLE [${esc(s.project)}]</div>
        <div class="term-actions">
          <select id="termSessionSelect" class="board-day" style="padding:2px 6px;font-size:11px">
            ${state.sessions.map(x=>`<option value="${esc(x.id)}"${x.id===s.id?' selected':''}>${esc(x.project)} (${x.status})</option>`).join('')}
          </select>
          <button class="term-btn" id="termColorBtn" title="Đổi màu hiển thị CRT">${termColor==='green'?'🟠 Amber':'🟢 Xanh'}</button>
          <button class="term-btn" id="termCopyBtn" title="Chép toàn bộ log">📋 Chép log</button>
          <button class="term-close" id="termX" aria-label="Đóng">&times;</button>
        </div>
      </div>
      <div class="term-screen${termColor==='amber'?' amber':''}" id="termScreen">
        ${banner}
        ${runawayAlert}
        <div id="termLogContent">${items}</div>
        <div style="margin-top:16px;opacity:.7">&gt; <span class="term-cursor" style="animation:screen .8s steps(1) infinite;background:currentColor;display:inline-block;width:8px;height:14px;vertical-align:middle"></span></div>
      </div>
    </div>
  `;

  document.getElementById('termX').onclick=closeTerminal;
  document.getElementById('termColorBtn').onclick=()=>{
    termColor=termColor==='green'?'amber':'green';
    try{localStorage.setItem('agentOfficeTermColor',termColor)}catch(e){}
    renderTerminal();
  };
  document.getElementById('termSessionSelect').onchange=e=>{
    termTargetSid=e.target.value;
    renderTerminal();
  };
  document.getElementById('termCopyBtn').onclick=()=>{
    const text=tools.map(t=>`[${clock(t.at)}] ${t.text}\nINPUT: ${t.input||''}\nOUTPUT: ${t.output||''}\n---`).join('\n\n');
    navigator.clipboard.writeText(text).then(()=>{
      const b=document.getElementById('termCopyBtn');
      if(b){b.textContent='✓ Đã chép!';setTimeout(()=>{if(document.getElementById('termCopyBtn'))document.getElementById('termCopyBtn').textContent='📋 Chép log'},1500)}
    });
  };
  td.querySelectorAll('.copy-cmd-btn').forEach(b=>{
    b.onclick=e=>{
      e.stopPropagation();
      navigator.clipboard.writeText(b.dataset.cmd);
      b.textContent='✓';
      setTimeout(()=>{b.textContent='📋'},1200);
    };
  });
}

function openTerminal(sid, toolId){
  termTargetSid=sid||selected||(state.sessions[0]&&state.sessions[0].id);
  termTargetToolId=toolId||null;
  const td=document.getElementById('termDrawer');
  td.hidden=false;
  renderTerminal();
  if(termTargetToolId){
    setTimeout(()=>{
      const el=td.querySelector('.cmd-block.target');
      if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
    },50);
  } else {
    setTimeout(()=>{
      const scr=document.getElementById('termScreen');
      if(scr) scr.scrollTop=scr.scrollHeight;
    },50);
  }
}

function closeTerminal(){
  document.getElementById('termDrawer').hidden=true;
  termTargetToolId=null;
}
document.getElementById('termBtn').onclick=()=>{
  const td=document.getElementById('termDrawer');
  td.hidden?openTerminal():closeTerminal();
};

// ---------- Bảng xếp hạng trong ngày ----------
const board=document.getElementById('board');
let boardTimer=null;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function rankList(title,rows,row){
  return `<h3>${title}</h3><ol class="rank">${rows.length?rows.map((r,i)=>`<li><span class="no">${['🥇','🥈','🥉'][i]||i+1}</span>${row(r)}</li>`).join(''):'<li class="st">Chưa có số liệu</li>'}</ol>`;
}
async function loadBoard(){
  const day=($('boardDay')&&$('boardDay').value)||today();
  let b;try{b=await (await fetch('/leaderboard?day='+day)).json()}catch(e){board.innerHTML='<p>Không tải được bảng xếp hạng.</p>';return}
  const sub=a=>`${person(color(a.team),'idle',a.id,false,a.type)}<span class="who"><b title="${esc(a.desc)}">${esc(a.desc)}</b><span class="st">${esc(a.project)} · ${esc(a.type)}${a.working?' · đang chạy':''}</span></span>`;
  const team=t=>`${person(color(t.id),'idle',t.id,true)}<span class="who"><b>${esc(t.project)}</b><span class="st" title="${esc(t.id)}">${esc(t.model||t.source||'')} · #${esc(t.id.slice(-6))}</span></span>`;
  board.innerHTML=`<button class="x" aria-label="Đóng" id="boardX">×</button>
    <h2>🏆 Xếp hạng trong ngày</h2>
    <div><input type="date" class="board-day" id="boardDay" value="${b.day}" max="${today()}" aria-label="Ngày"> <span class="st">${b.subagents} sub-agent · ${b.events} sự kiện</span></div>
    ${rankList('Chạy lâu nhất',b.longest,a=>sub(a)+`<span class="val">${ago(a.ms)}</span>`)}
    ${rankList('Gọi nhiều tool nhất',b.busiest,a=>sub(a)+`<span class="val">${a.tools} tool</span>`)}
    ${rankList('Nhóm tốn nhiều token nhất',b.tokens,t=>team(t)+`<span class="val">${fmtTok(t.tokens)}${t.usage&&t.usage.cost!=null?' · '+fmtCost(t.usage.cost):''}</span>`)}
    ${rankList('Nhóm chăm chỉ nhất',b.teams,t=>team(t)+`<span class="val">${t.tools} tool · ${t.agents} sub-agent</span>`)}
    <p class="st">Số token là của cả nhóm (omp/Claude Code không tách token cho từng sub-agent). Sub-agent đã xong vẫn được tính dù đã rời góc cà phê.</p>`;
  $('boardX').onclick=closeBoard;
  $('boardDay').onchange=loadBoard;
}
function openBoard(){board.hidden=false;loadBoard();clearInterval(boardTimer);boardTimer=setInterval(()=>{if($('boardDay').value===today())loadBoard()},30e3)}
function closeBoard(){board.hidden=true;clearInterval(boardTimer);boardTimer=null}
document.getElementById('boardBtn').onclick=()=>board.hidden?openBoard():closeBoard();

// ---------- Xem lại (replay) từ events.jsonl ----------
let replay=null, live=state;
const $=id=>document.getElementById(id);
function showFrame(){
  state=replay.frames[replay.i];
  $('replaySlider').value=replay.i;
  $('replayLabel').textContent=`${clock(state.now)} (${replay.i+1}/${replay.frames.length})`;
  render();
}
function stopPlay(){if(replay&&replay.timer){clearInterval(replay.timer);replay.timer=null}$('replayPlay').textContent='▶ Phát'}
async function startReplay(){
  const r=await fetch('/replay?minutes='+$('replayMin').value);
  const frames=await r.json();
  $('replaybar').hidden=false;
  if(!frames.length){stopPlay();replay=null;$('replayLabel').textContent='Chưa có log trong khoảng này';return}
  stopPlay();
  replay={frames,i:frames.length-1,timer:null};
  $('replaySlider').max=frames.length-1;
  showFrame();
}
function exitReplay(){
  stopPlay();replay=null;$('replaybar').hidden=true;prev=null;
  state=live;offset=state.now-Date.now();render();
}
$('replayBtn').onclick=startReplay;
$('replayMin').onchange=startReplay;
$('replayLive').onclick=exitReplay;
$('replaySlider').oninput=e=>{if(!replay)return;stopPlay();replay.i=+e.target.value;showFrame()};
$('replayPlay').onclick=()=>{
  if(!replay)return;
  if(replay.timer){stopPlay();return}
  if(replay.i>=replay.frames.length-1)replay.i=0;
  $('replayPlay').textContent='⏸ Dừng';
  replay.timer=setInterval(()=>{if(replay.i>=replay.frames.length-1){stopPlay();return}replay.i++;showFrame()},400);
};

// ---------- Quản lý hook ----------
const hookDrawer=document.getElementById('hookDrawer');
let hookMsg='';
// Server trả {error} (403/405) hoặc danh sách [{id,name,file,installed,msg,error}]
async function hookCall(path,opts){
  try{
    const r=await fetch(path,opts), body=await r.json();
    if(!r.ok){hookMsg=body.error||('Lỗi '+r.status);return null}
    hookMsg='';return body;
  }catch(e){hookMsg='Không gọi được server: '+e.message;return null}
}
async function loadHooksUI(){hookDrawer.hidden=false;renderHooksDrawer(await hookCall('/hooks-status')||[])}
function closeHooksUI(){hookDrawer.hidden=true}
const hookTests={}; // id -> kết quả Gửi thử gần nhất {ok, ms, error}
async function hookAction(kind,only){
  if(kind==='uninstall'&&!confirm(only?'Gỡ hook của Agent Office khỏi công cụ này?':'Gỡ hook của Agent Office khỏi tất cả công cụ?'))return;
  hookDrawer.querySelectorAll('button[data-act]').forEach(b=>b.disabled=true);
  const res=await hookCall('/hooks-'+kind+(only?'?only='+only:''),{method:'POST'});
  if(kind==='test'){if(res)hookTests[only]=res;renderHooksDrawer(await hookCall('/hooks-status')||[]);return}
  const msg=hookMsg, list=res||await hookCall('/hooks-status')||[];
  hookMsg=hookMsg||msg;
  renderHooksDrawer(list);
}
const seenText=t=>t?'Nhận sự kiện lần cuối '+ago(Date.now()-t)+' trước':'Chưa nhận sự kiện nào (7 ngày qua)';
function renderHooksDrawer(items){
  const cards=items.map(it=>`
    <div class="hook-item">
      <div class="info"><b>${esc(it.name)}</b><small>${esc(it.file)}</small>${it.error?`<small style="color:var(--coral)">⚠ ${esc(it.error)}</small>`:it.msg?`<small>${esc(it.msg)}</small>`:''}
        <small style="color:${it.lastSeen?'var(--mint)':'var(--muted)'}">${seenText(it.lastSeen)}</small>
        ${hookTests[it.id]?`<small style="color:${hookTests[it.id].ok?'var(--mint)':'var(--coral)'}">${hookTests[it.id].ok?`✓ Gửi thử: server nhận sau ${hookTests[it.id].ms} ms`:'✗ Gửi thử: '+esc(hookTests[it.id].error)}</small>`:''}</div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <span class="hook-badge ${it.installed?'on':'off'}">${it.error?'LỖI':it.installed?'✓ ĐÃ CÀI':'○ CHƯA CÀI'}</span>
        ${it.installed?`<button class="sound" data-act="test" data-only="${esc(it.id)}" style="padding:4px 8px;font-size:11px" title="Chạy lệnh hook đã cài với payload mẫu và kiểm tra server có nhận được không">Gửi thử</button>`:''}
        <button class="sound" data-act="${it.installed?'uninstall':'install'}" data-only="${esc(it.id)}" style="padding:4px 8px;font-size:11px">${it.installed?'Gỡ':'Cài'}</button>
      </div>
    </div>`).join('');
  hookDrawer.innerHTML=`
    <button class="x" aria-label="Đóng" id="hookX">×</button>
    <h2>⚡ Quản lý hook</h2>
    <p class="st">Cài hook để Claude Code, Gemini CLI, Codex và Antigravity gửi hoạt động về văn phòng. File cấu hình được sao lưu thành <code>.bak-agent-office</code> trước lần sửa đầu tiên; file có comment hoặc không phải JSON chuẩn sẽ không bị sửa.</p>
    ${hookMsg?`<p style="color:var(--coral)">⚠ ${esc(hookMsg)}</p>`:''}
    <div class="hook-btn-row">
      <button class="btn-install" data-act="install">⚡ Cài tất cả</button>
      <button class="btn-uninstall" data-act="uninstall">🗑️ Gỡ tất cả</button>
    </div>
    <div id="hookList">${cards}</div>
    <p class="st">Sau khi cài: khởi động lại phiên Claude Code / Gemini / Codex, mở hội thoại mới trong Antigravity.</p>
    <h3>Dòng lệnh</h3>
    <div class="prompt" style="font-size:11px">node setup-hooks.js --status<br>node setup-hooks.js            # cài tất cả<br>node setup-hooks.js --uninstall</div>
    <h3>omp (oh-my-pi)</h3>
    <div class="prompt" style="font-size:11px">omp -e ./omp-office.ts</div>`;
  $('hookX').onclick=closeHooksUI;
  hookDrawer.querySelectorAll('button[data-act]').forEach(b=>b.onclick=()=>hookAction(b.dataset.act,b.dataset.only));
}
document.getElementById('hookBtn').onclick=()=>hookDrawer.hidden?loadHooksUI():closeHooksUI();

function connect(){
  const es=new EventSource('/events');
  es.onopen=()=>{document.getElementById('bar').classList.remove('off');document.getElementById('conn').textContent='Đã kết nối'};
  es.onmessage=e=>{live=JSON.parse(e.data);if(replay)return;state=live;offset=state.now-Date.now();detectChanges(state.sessions);render()};
  es.onerror=()=>{document.getElementById('bar').classList.add('off');document.getElementById('conn').textContent='Mất kết nối tới server, đang thử lại…'};
}
initMascot(); connect(); setInterval(render,1000);
</script>
</body>
